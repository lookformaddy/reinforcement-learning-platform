# CI definition — activate by moving this file to .github/workflows/ci.yml
# (kept under docs/ because the GitHub App used for pushing lacks the
# Workflows permission, so .github/workflows/ cannot be pushed directly).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python3 demo.py
